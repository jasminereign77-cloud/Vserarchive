<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Access File</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK -->
  <script
    src="//libtl.com/sdk.js"
    data-zone="11720925"
    data-sdk="show_11720925">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: #1d1d1d;
      border-radius: 20px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .icon {
      font-size: 58px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    p {
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 16px;
      background: #2aabee;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      margin-top: 16px;
      min-height: 20px;
      font-size: 14px;
      color: #bbb;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="icon">📂</div>

      <h1>Access File</h1>

      <p>
        Watch the sponsored ads to access the file.
      </p>

      <button id="watchBtn" onclick="watchAd()">
        📺 Watch Ads to Access File 📂
      </button>

      <div id="status"></div>

    </div>
  </div>

  <script>
    // Initialize Telegram Mini App
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    const button = document.getElementById("watchBtn");
    const status = document.getElementById("status");

    const FILE_URL =
      "https://mega.nz/folder/ew4kWaaL#JsKxDK4GNAhNkoGPcZoA4A";

    async function watchAd() {
      button.disabled = true;
      button.textContent = "⏳ Loading Ad...";
      status.textContent = "";

      try {
        if (typeof show_11720925 !== "function") {
          throw new Error("Monetag SDK has not loaded.");
        }

        await show_11720925("pop");

        status.textContent = "✅ Ad completed! Opening file 📂";

        // Open the file after the ad promise resolves
        window.location.href = FILE_URL;

      } catch (error) {
        console.error("Monetag error:", error);

        status.textContent =
          "❌ The ad could not be loaded. Please try again.";

        button.disabled = false;
        button.textContent = "📺 Watch Ads to Access File 📂";
      }
    }
  </script>

</body>
</html>
